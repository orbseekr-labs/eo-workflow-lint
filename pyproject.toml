[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eo-workflow-lint"
version = "0.1.0"
description = "A deterministic, offline static analyzer for scientifically unsafe Earth observation workflows."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "OrbSeekr Labs" }]
maintainers = [{ name = "OrbSeekr Labs" }]
keywords = [
    "earth-observation",
    "google-earth-engine",
    "static-analysis",
    "linter",
    "remote-sensing",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Software Development :: Quality Assurance",
]
# The v0.1.0 runtime uses only the Python standard library (SPECIFICATION §20).
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
eo-workflow-lint = "eo_workflow_lint.cli:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eo_workflow_lint = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"
# Ruff must never rewrite Markdown. SPECIFICATION.md is FROZEN, and newer ruff
# versions format Python code blocks inside Markdown files by default.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/fixtures/*" = ["F821", "E402", "F841"]
