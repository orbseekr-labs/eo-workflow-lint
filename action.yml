name: eo-workflow-lint
description: >-
  Deterministic, offline static analysis of Google Earth Engine Python workflows.
  Runs entirely on the runner: no Earth Engine credentials, no network access,
  no source code upload, no telemetry.
author: OrbSeekr Labs

branding:
  icon: check-circle
  color: green

inputs:
  fail-on:
    description: >-
      Severity threshold that fails the step. "fail" (default) fails only on FAIL
      findings; "conditional" also fails on CONDITIONAL findings. Files that cannot
      be analyzed (for example a Python syntax error) always fail the step.
    required: false
    default: fail
  paths:
    description: >-
      Newline-separated Git pathspecs selecting the tracked files to analyze.
      Only ".py" files are analyzed; other matches are ignored. Exclusions use
      the ":!" pathspec prefix, for example ":!notebooks/**".
    required: false
    default: "*.py"

outputs:
  verdict:
    description: Overall verdict, PASS, CONDITIONAL or FAIL (FAIL > CONDITIONAL > PASS).
    value: ${{ steps.analyze.outputs.verdict }}
  files-checked:
    description: Number of Python files analyzed.
    value: ${{ steps.analyze.outputs.files-checked }}
  findings:
    description: Total number of unsuppressed findings across all files.
    value: ${{ steps.analyze.outputs.findings }}
  fail-count:
    description: Number of FAIL findings.
    value: ${{ steps.analyze.outputs.fail-count }}
  conditional-count:
    description: Number of CONDITIONAL findings.
    value: ${{ steps.analyze.outputs.conditional-count }}
  not-analyzable:
    description: Number of Python files that could not be analyzed (invalid input).
    value: ${{ steps.analyze.outputs.not-analyzable }}
  exit-code:
    description: "Runner exit code: 0 below threshold, 1 threshold reached, 2 invalid input, 3 internal failure."
    value: ${{ steps.analyze.outputs.exit-code }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Analyze tracked Python files with eo-workflow-lint
      id: analyze
      shell: bash
      # Inputs reach the script through the environment only; nothing is
      # interpolated into the shell text, so input values are never executed.
      env:
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_PATHS: ${{ inputs.paths }}
        EWL_ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail

        case "$INPUT_FAIL_ON" in
          fail|conditional) ;;
          *)
            echo "::error title=eo-workflow-lint::invalid fail-on value '$INPUT_FAIL_ON'; expected 'fail' or 'conditional'"
            exit 2 ;;
        esac

        if ! git -C "$GITHUB_WORKSPACE" rev-parse --is-inside-work-tree >/dev/null 2>&1; then
          echo "::error title=eo-workflow-lint::$GITHUB_WORKSPACE is not a Git checkout; add a 'uses: actions/checkout' step before this action"
          exit 2
        fi

        # One pathspec per line, collected into an array and passed to git with
        # quoted expansion: no word splitting, so pathspecs and filenames with
        # spaces or Unicode are safe. (A read loop rather than mapfile so the
        # step also runs on bash 3.2.)
        PATHSPECS=()
        while IFS= read -r spec || [ -n "$spec" ]; do
          spec="${spec%$'\r'}"
          if [ -n "${spec//[[:space:]]/}" ]; then
            PATHSPECS+=("$spec")
          fi
        done <<< "$INPUT_PATHS"
        if [ "${#PATHSPECS[@]}" -eq 0 ]; then
          PATHSPECS=("*.py")
        fi

        # The pinned ref's own source tree is used directly. Nothing is
        # installed or downloaded; the package is standard-library only.
        git -C "$GITHUB_WORKSPACE" ls-files -z -- "${PATHSPECS[@]}" \
          | PYTHONPATH="$EWL_ACTION_PATH/src" python "$EWL_ACTION_PATH/action/run.py" \
              --fail-on "$INPUT_FAIL_ON" --workspace "$GITHUB_WORKSPACE"
